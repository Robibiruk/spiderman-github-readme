name: Refresh Spider-Man Assets

on:
  schedule:
    # Every Monday and Thursday at 06:17 UTC
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/generate.py --username ${{ github.repository_owner }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/arsenal.svg assets/swing.svg assets/achievements.svg assets/hero-stats.svg assets/streak.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🕸️ refresh spider assets [skip ci]"
            git push
          fi
